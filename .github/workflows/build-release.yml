name: Build Cross-Platform Releases (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            cmd: npm run dist:linux
          - os: windows-latest
            platform: windows
            cmd: npm run dist:win
          - os: macos-latest
            platform: macos
            cmd: npm run dist:mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run protocol unit tests
        run: npm test

      - name: Build distributables for ${{ matrix.platform }}
        run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Release Artifacts (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: open-musicflow-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
